<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Manrope:wght@600;700;800&amp;display=swap');
      .mono {
        font-family: 'DM Mono', monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .sans {
        font-family: 'Manrope', sans-serif;
        letter-spacing: -0.04em;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#111111" />

  <!-- Outer frame border -->
  <rect x="40" y="40" width="1120" height="550" rx="4" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Red accent bar at top -->
  <rect x="40" y="40" width="160" height="4" fill="#FF262A" />

  <!-- Label / Kicker -->
  <text x="80" y="130" class="mono" font-size="16" font-weight="500" fill="#FF262A">* PARA REVISTAS, MEDIOS REGIONALES Y NEWSLETTERS</text>

  <!-- Headline -->
  <text x="80" y="240" class="sans" font-size="64" font-weight="700" fill="#FFFFFF" line-height="1.08">
    <tspan x="80" dy="0">Sitios rápidos y CMS</tspan>
    <tspan x="80" dy="78">a la medida de tu redacción</tspan>
  </text>

  <!-- Supporting value props pills -->
  <g transform="translate(80, 390)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="40" rx="20" stroke="rgba(255, 255, 255, 0.25)" fill="transparent" />
    <text x="85" y="25" class="mono" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">ASTRO + STRAPI</text>

    <!-- Pill 2 -->
    <rect x="186" y="0" width="200" height="40" rx="20" stroke="rgba(255, 255, 255, 0.25)" fill="transparent" />
    <text x="286" y="25" class="mono" font-size="13" font-weight="400" fill="#FFFFFF" text-anchor="middle">CLOUDFLARE SPEED</text>

    <!-- Pill 3 -->
    <rect x="402" y="0" width="210" height="40" rx="20" stroke="#FF262A" fill="rgba(255, 38, 42, 0.12)" />
    <text x="507" y="25" class="mono" font-size="13" font-weight="500" fill="#FF262A" text-anchor="middle">CUOTA MENSUAL FIJA</text>
  </g>

  <!-- Dividing line before footer -->
  <line x1="80" y1="486" x2="1120" y2="486" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Footer credit -->
  <text x="80" y="534" class="mono" font-size="15" font-weight="500" fill="#FFFFFF">FABIÁN JELDES / DESARROLLO WEB PARA MEDIOS</text>
  <text x="1120" y="534" class="mono" font-size="14" font-weight="400" fill="#888888" text-anchor="end">SISTEMAS EDITORIALES INDEPENDIENTES</text>
</svg>